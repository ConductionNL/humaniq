version: 2

# hrmq had NO dependabot.yml at all, so neither ecosystem had a cooldown: every
# dependency update landed the moment it was published. That is precisely the
# window in which a compromised release is still on the registry, and an
# instant update walks straight into it. Both entries below carry a cooldown
# and both exclude first-party packages — see the note on the composer entry.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
      include:
        - "*"
      exclude:
        - "@conduction/*"

  # Two days is the floor gate-93 enforces.
  #
  # Our own packages are excluded from the wait on purpose. A cooldown protects
  # against a compromised upstream release; `conduction/*` comes from this
  # fleet's own CI, and delaying it would only slow the loop between a fix
  # being released here and arriving here.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
      include:
        - "*"
      exclude:
        - "conduction/*"
